<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1F3A5F; display: grid; place-items: center; height: 100vh; margin: 0; }
</style>
</head>
<body>
<p id="msg">Opening Microsoft sign-in…</p>
<script>
// Sign-in for the Invoice Mail Merge add-in.
// Authorization code flow with PKCE against Microsoft Entra ID; the access token is
// handed back to the task pane and never stored.
const KEY = "imm_auth";

function b64url(bytes) {
  let s = "";
  bytes.forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function randomString(n) {
  const a = new Uint8Array(n);
  crypto.getRandomValues(a);
  return b64url(a);
}
async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return b64url(new Uint8Array(buf));
}
function reply(obj) {
  Office.context.ui.messageParent(JSON.stringify(obj));
}

Office.onReady(async () => {
  const p = new URLSearchParams(location.search);
  try {
    if (p.has("error")) {
      throw new Error(p.get("error_description") || p.get("error"));
    }

    if (p.has("code")) {
      // Returning from Microsoft: exchange the code for a token.
      document.getElementById("msg").textContent = "Finishing sign-in…";
      const st = JSON.parse(sessionStorage.getItem(KEY) || "{}");
      sessionStorage.removeItem(KEY);
      if (!st.state || p.get("state") !== st.state) throw new Error("Sign-in was interrupted. Try again.");

      const body = new URLSearchParams({
        client_id: st.client,
        grant_type: "authorization_code",
        code: p.get("code"),
        redirect_uri: st.redirect,
        code_verifier: st.verifier,
        scope: st.scope
      });
      const r = await fetch(`https://login.microsoftonline.com/${encodeURIComponent(st.tenant)}/oauth2/v2.0/token`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error_description || j.error || "Token request failed");
      reply({ token: j.access_token, expiresIn: j.expires_in });
      return;
    }

    // First load: start the sign-in.
    const client = p.get("client");
    const tenant = p.get("tenant") || "organizations";
    if (!client) throw new Error("Missing Application (client) ID.");
    const scope = "User.Read Mail.Send" + (p.get("shared") === "1" ? " Mail.Send.Shared" : "");
    const verifier = randomString(48);
    const state = randomString(16);
    const redirect = location.origin + location.pathname;
    sessionStorage.setItem(KEY, JSON.stringify({ client, tenant, scope, verifier, state, redirect }));

    const q = new URLSearchParams({
      client_id: client,
      response_type: "code",
      redirect_uri: redirect,
      response_mode: "query",
      scope,
      state,
      code_challenge: await sha256(verifier),
      code_challenge_method: "S256",
      prompt: "select_account"
    });
    location.href = `https://login.microsoftonline.com/${encodeURIComponent(tenant)}/oauth2/v2.0/authorize?${q}`;
  } catch (e) {
    reply({ error: e.message || String(e) });
  }
});
</script>
</body>
</html>
